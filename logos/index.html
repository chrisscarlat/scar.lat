      display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 12%; text-align: left;

    .deck-btns { display: flex; justify-content: center; align-items: center; gap: 26px; margin-top: 14px; flex: none; }

      { slug: 'futurevibrations', name: 'Future Vibrations', industry: 'Brand identity', location: '', year: '2024',

      { slug: 'vara', name: 'Vara AI', industry: 'AI', location: '', year: '2024',

      { slug: 'roa', name: 'ROA', industry: 'Brand identity', location: 'Cluj-Napoca\nRomania', year: '2024',

      { slug: 'spellbound', name: 'Spellbound', industry: 'Brand identity', location: '', year: '2024',

      { slug: 'goya', name: 'Goya', industry: 'Luxury dining · Food storytelling', location: 'Brașov\nRomania', year: '2018',
        desc: 'Stacked layers that form a gateway, like courses served one after another, for a restaurant that tells stories through food.' },
      { slug: 'coee', name: 'The College of Extraordinary Experiences', industry: 'Experience design · Education', location: 'Copenhagen\nDenmark', year: '2016',
        desc: 'A phoenix rising with a star overhead: the symbol of an experience-design festival held in a castle.' },

      { slug: 'detect', name: 'Detect Classic Festival', industry: 'Music festival', location: 'Berlin\nGermany', year: '2017',
        desc: 'Two half-circles that build a D and a C out of fine radiating lines, like sound fanning out. Made for the festival\'s 2nd edition.' },
      { slug: 'amazoncard', name: 'Amazon Credit Card', industry: 'Fintech · E-commerce', location: 'Munich\nGermany', year: '2019',

        desc: 'A row of peaks that rise and fall like a workout: effort, rest, effort.' },
      { slug: 'healthquotient', name: 'Health Quotient', industry: 'Health', location: 'Melbourne\nAustralia', year: '2018',
        desc: 'A Q made from a rounded square with a leaf inside: health as something you can measure and grow.' },
      { slug: 'frontstyle', name: 'FRONT STYLE', industry: 'Brand delivery', location: 'Berlin\nGermany', year: '2026',
        desc: 'Nested frames, a brand library inside a screen. FRONT STYLE is the digital home where all of these logos live.' }
    ];

    var MOBILE = function () { return window.innerWidth <= 768; };
    var $ = function (s, r) { return (r || document).querySelector(s); };
    var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
    var src = function (l) { return './svg/' + l.slug + '.svg'; };
    var id = function (l) { return '/logos/svg/' + l.slug + '.svg'; };

    // ---- votes: same store as the main site (this browser + the anonymous vote table) ----
    var VKEY = 'scarlat-votes', QKEY = 'scarlat-vote-queue';
    var votes = (function () { try { return JSON.parse(localStorage.getItem(VKEY) || '{}') || {}; } catch (e) { return {}; } })();
    function sendVote(rec) {
      var consent = window.scarConsent ? window.scarConsent() : null;
      if (consent === 'no') return; // visitor said no: nothing is kept or sent
      var q; try { q = JSON.parse(localStorage.getItem(QKEY) || '[]'); } catch (e) { q = []; }
      q.push(rec);
      var url = window.SCARLAT_VOTES_URL || 'https://dcfuliyfkbeyqmumfagp.supabase.co/functions/v1/scarlat-vote';
      if (consent === 'yes' && navigator.sendBeacon) {
        try { if (navigator.sendBeacon(url, new Blob([JSON.stringify(q)], { type: 'text/plain' }))) q = []; } catch (e) {}
      }
      try { localStorage.setItem(QKEY, JSON.stringify(q.slice(-500))); } catch (e) {}
    }
    function voteOf(l) { var v = votes[id(l)]; return v && v.v; }
    function castVote(l, v, toggle) {
      var k = id(l);
      if (toggle && votes[k] && votes[k].v === v) { delete votes[k]; v = 'none'; }
      else votes[k] = { v: v, c: 'Logo: ' + l.name, t: Date.now() };
      try { localStorage.setItem(VKEY, JSON.stringify(votes)); } catch (e) {}
      sendVote({ image: k, project: 'Logo: ' + l.name, vote: v, ts: new Date().toISOString(),
        lang: document.documentElement.lang || 'en', device: MOBILE() ? 'mobile' : 'desktop' });
      var li = document.querySelector('.lg-item[data-slug="' + l.slug + '"]');
      if (li) li.dataset.vote = v;
      return v;
    }

    function factsHTML(l, card) {
      var rows = card ? [['Client', l.name], ['Location', l.location], ['Year', l.year], ['Designer', 'Chris Scarlat']]
                      : [['Client', l.name], ['Location', l.location], ['Industry', l.industry], ['Year', l.year],
                         ['Designer', '<a href="../">Chris Scarlat</a>']];
      return rows.filter(function (r) { return r[1]; }).map(function (r) {
        return '<div class="row k-' + r[0].toLowerCase() + '"><span class="lab">' + r[0] + '</span><span class="val">' + (r[0] === 'Designer' && !card ? r[1] : esc(r[1])) + '</span></div>';
      }).join('');
    }

    // ---- grid ----
    var HEART = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.1 4.3 2.4h2c.7-1.3 2.2-2.4 4.3-2.4 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>';
    var grid = $('#lg-grid');
    grid.innerHTML = LOGOS.map(function (l, i) {
      return '<li class="lg-item" data-slug="' + l.slug + '" data-vote="' + (voteOf(l) || '') + '">' +
        '<button type="button" class="lg-tile" data-i="' + i + '" aria-label="' + esc(l.name) + ': details">' +
        '<div class="lg-mark"><img src="' + src(l) + '" alt="' + esc(l.name) + ' logo" loading="lazy" decoding="async"></div>' +
        '<div class="lg-cap"><b>' + esc(l.name) + '</b><span>' + esc(l.industry) + '</span><i>—</i><i>' + esc(l.year) + '</i></div>' +
        '</button><span class="lg-dot" aria-hidden="true">' + HEART + '</span></li>';
    }).join('');
    // closing tile, same size as a logo: invites a logo project, opens the chat (assets/site-menu.js)
    grid.insertAdjacentHTML('beforeend',
      '<li class="lg-item lg-cta"><a href="#chat" class="lg-tile" data-open-chat>' +
        '<div class="lg-mark"><div class="cta-box"><strong>Do you like what you see?</strong>' +
        '<span>Would you like your logo designed by me?</span><em>Let\u2019s talk \u2192</em></div></div>' +
        '<div class="lg-cap"><b>Your logo</b><span>Brand identity</span><i>—</i><i>Next</i></div></a></li>');

    // ---- detail view ----
    var det = $('.lg-detail'), cur = 0, lastFocus = null;
    function fillDetail(i) {
      cur = (i + LOGOS.length) % LOGOS.length;
      var l = LOGOS[cur];
      $('.d-mark img', det).src = src(l); $('.d-mark img', det).alt = l.name + ' logo';
      $('.d-name', det).textContent = l.name;
      $('.d-desc', det).textContent = l.desc;
      $('.facts', det).innerHTML = factsHTML(l);
      $('.d-count', det).textContent = String(cur + 1).padStart(2, '0') + ' / ' + LOGOS.length;
      var v = voteOf(l);
      $('.vote-yes', det).setAttribute('aria-pressed', v === 'like' ? 'true' : 'false');
      $('.vote-no', det).setAttribute('aria-pressed', v === 'dislike' ? 'true' : 'false');
    }
    function openDetail(i) {
      lastFocus = document.activeElement;
      fillDetail(i); det.classList.add('open'); document.body.style.overflow = 'hidden';
      $('.d-close', det).focus({ preventScroll: true });
    }
    function closeDetail() {
      det.classList.remove('open'); document.body.style.overflow = '';
      if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
    }
    grid.addEventListener('click', function (e) { var t = e.target.closest('.lg-tile'); if (t && t.dataset.i != null) openDetail(+t.dataset.i); });
    $('.d-close', det).addEventListener('click', closeDetail);
    $('.d-prev', det).addEventListener('click', function () { fillDetail(cur - 1); });
    $('.d-next', det).addEventListener('click', function () { fillDetail(cur + 1); });
    det.addEventListener('click', function (e) {
      var b = e.target.closest('.vote-yes, .vote-no'); if (!b) return;
      var v = castVote(LOGOS[cur], b.classList.contains('vote-yes') ? 'like' : 'dislike', true);
      fillDetail(cur);
      if (b.animate) b.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.25)' }, { transform: 'scale(1)' }], { duration: 280, easing: 'cubic-bezier(.34,1.56,.64,1)' });
      if (v !== 'none') setTimeout(function () { if (det.classList.contains('open')) fillDetail(cur + 1); }, 420);
    });
    document.addEventListener('keydown', function (e) {
      if (!det.classList.contains('open')) return;
      if (e.key === 'Escape') closeDetail();
      else if (e.key === 'ArrowRight') fillDetail(cur + 1);
      else if (e.key === 'ArrowLeft') fillDetail(cur - 1);
    });

    // ---- mobile card deck (Tinder-style) ----
    var stack = $('.deck-stack'), text = $('.deck-text'), countEl = $('.deck-count'), done = $('.deck-done');
    // logos not voted on yet come first
    var order = LOGOS.map(function (_, i) { return i; }).sort(function (a, b) { return (voteOf(LOGOS[a]) ? 1 : 0) - (voteOf(LOGOS[b]) ? 1 : 0); });
    var pos = 0, cards = [];
    function cardHTML(l) {
      return '<span class="stamp like">LIKE</span><span class="stamp nope">NOPE</span>' +
        '<div class="c-mark"><img src="' + src(l) + '" alt="' + esc(l.name) + ' logo" draggable="false"></div>' +
        '<div class="facts">' + factsHTML(l, true) + '</div>';
    }
    function renderDeck() {
      cards.forEach(function (c) { c.remove(); }); cards = [];
      done.classList.toggle('show', pos >= order.length);
      if (pos >= order.length) { text.innerHTML = '<span class="k">Logos</span><strong>All done</strong><p>Switch to "All logos" to browse the whole collection.</p>'; countEl.textContent = order.length + ' / ' + order.length; return; }
      for (var k = Math.min(pos + 2, order.length - 1); k >= pos; k--) {
        var c = document.createElement('div');
        c.className = 'card' + (k === pos + 1 ? ' back' : k === pos + 2 ? ' back2' : '');
        c.innerHTML = cardHTML(LOGOS[order[k]]);
        stack.appendChild(c); cards.push(c);
      }
      var l = LOGOS[order[pos]];
      text.innerHTML = '<span class="k">' + esc([l.industry, l.year].filter(Boolean).join(' · ')) + '</span><strong>' + esc(l.name) + '</strong><p>' + esc(l.desc) + '</p>';
      text.scrollTop = 0;
      countEl.textContent = (pos + 1) + ' / ' + order.length;
    }
    function topCard() { return cards[cards.length - 1]; }
    function fling(v) {
      var c = topCard(); if (!c || pos >= order.length) return;
      castVote(LOGOS[order[pos]], v, false);
      var dir = v === 'like' ? 1 : -1;
      c.querySelector('.stamp.' + (v === 'like' ? 'like' : 'nope')).style.opacity = 1;
      c.style.transition = 'transform .38s cubic-bezier(.3,.7,.4,1), opacity .38s';
      c.style.transform = 'translate(' + dir * window.innerWidth * 1.2 + 'px, -30px) rotate(' + dir * 24 + 'deg)';
      c.style.opacity = 0;
      setTimeout(function () { pos++; renderDeck(); }, 300);
    }
    $('.deck-btns .vote-yes').addEventListener('click', function () { fling('like'); });
    $('.deck-btns .vote-no').addEventListener('click', function () { fling('dislike'); });

    var sx = 0, sy = 0, dx = 0, dragging = false, locked = null;
    stack.addEventListener('touchstart', function (e) {
      if (!topCard() || pos >= order.length) return;
      var t = e.touches[0]; sx = t.clientX; sy = t.clientY; dx = 0; dragging = true; locked = null;
      topCard().style.transition = 'none';
    }, { passive: true });
    stack.addEventListener('touchmove', function (e) {
      if (!dragging) return;
      var t = e.touches[0], mx = t.clientX - sx, my = t.clientY - sy;
      if (locked === null && Math.abs(mx) + Math.abs(my) > 8) locked = Math.abs(mx) > Math.abs(my) ? 'x' : 'y';
      if (locked !== 'x') return;
      e.preventDefault();
      dx = mx;
      var c = topCard();
      c.style.transform = 'translate(' + dx + 'px,' + my * 0.15 + 'px) rotate(' + dx / 18 + 'deg)';
      var p = Math.min(1, Math.abs(dx) / 90);
      c.querySelector('.stamp.like').style.opacity = dx > 0 ? p : 0;
      c.querySelector('.stamp.nope').style.opacity = dx < 0 ? p : 0;
    }, { passive: false });
    function endDrag() {
      if (!dragging) return; dragging = false;
      var c = topCard(); if (!c) return;
      if (locked === 'x' && Math.abs(dx) > 90) { fling(dx > 0 ? 'like' : 'dislike'); return; }
      c.style.transition = 'transform .3s cubic-bezier(.34,1.56,.64,1)';
      c.style.transform = '';
      c.querySelectorAll('.stamp').forEach(function (s) { s.style.opacity = 0; });
    }
    stack.addEventListener('touchend', endDrag);
    stack.addEventListener('touchcancel', endDrag);

    // ---- Cards / All logos switch (mobile) ----
    function setMode(m) {
      document.body.classList.toggle('mode-cards', m === 'cards');
      document.querySelectorAll('.lg-switch button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.mode === m ? 'true' : 'false'); });
      try { sessionStorage.setItem('scarlat-logos-mode', m); } catch (e) {}
      if (m === 'all') document.querySelectorAll('.lg-item[data-slug]').forEach(function (li) { var l = LOGOS.find(function (x) { return x.slug === li.dataset.slug; }); li.dataset.vote = voteOf(l) || ''; });
    }
    document.addEventListener('click', function (e) { var b = e.target.closest('[data-mode]'); if (b) setMode(b.dataset.mode); });
    var saved = null; try { saved = sessionStorage.getItem('scarlat-logos-mode'); } catch (e) {}
    setMode(saved || 'cards');
    renderDeck();
  })();
  </script>

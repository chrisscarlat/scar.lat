<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chris Scarlat — Gallery</title>
  <meta name="description" content="Chris Scarlat's work, laid out along the word Scarlat in script — scroll to glide across it.">
  <link rel="icon" href="../fav/fav.ico" sizes="any">
  <link rel="icon" href="../fav/fav.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; }
    body { font-family: 'Inter', Helvetica, Arial, sans-serif; }

    #canvas-container { position: fixed; inset: 0; width: 100vw; height: 100vh; }
    canvas { display: block; width: 100% !important; height: 100% !important; }

    /* --- Top bar: site name + back link --- */
    .cg-top {
      position: fixed; top: 0; left: 0; right: 0; z-index: 3;
      display: flex; align-items: center; justify-content: space-between;
      padding: 22px 28px; text-transform: uppercase; font-size: 14px; font-weight: 600;
      letter-spacing: .01em; mix-blend-mode: difference; color: #fff;
    }
    .cg-top a { color: inherit; text-decoration: none; }
    .cg-top a:hover { opacity: .7; }

    /* --- Auto/scroll toggle (bottom centre) --- */
    .scroll-toggle {
      position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 3;
      padding: .65rem 1.5rem; border: 1px solid rgba(0,0,0,.15); border-radius: 999px;
      background: rgba(255,255,255,.62); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      color: #2a2a28; font-family: inherit; font-size: .82rem; letter-spacing: .04em;
      text-transform: uppercase; cursor: pointer; transition: all .2s ease;
    }
    .scroll-toggle:hover { background: rgba(255,255,255,.9); }
    .scroll-toggle.active { background: #16161a; color: #f0ede8; border-color: #16161a; }

    .cg-hint {
      position: fixed; bottom: 24px; right: 28px; z-index: 3;
      font-size: 12px; color: #8a8a85; letter-spacing: .02em; user-select: none;
    }
    @media (max-width: 640px) { .cg-hint { display: none; } }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://esm.sh/three@0.184.0",
      "gsap": "https://esm.sh/gsap@3.15.0",
      "gsap/Observer": "https://esm.sh/gsap@3.15.0/Observer"
    }
  }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <header class="cg-top notranslate" translate="no">
    <a href="https://scar.lat" class="cg-name">Chris Scarlat</a>
  </header>

  <button id="scroll-toggle" class="scroll-toggle" type="button">Scroll</button>

  <div class="cg-hint">Scroll / drag to glide across</div>

  <script type="module">
    import * as THREE from 'three'
    import { gsap } from 'gsap'
    import { Observer } from 'gsap/Observer'

    gsap.registerPlugin(Observer)

    const renderer = new THREE.WebGLRenderer({ antialias: true })
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
    renderer.setSize(window.innerWidth, window.innerHeight)
    document.getElementById('canvas-container').appendChild(renderer.domElement)

    const scene = new THREE.Scene()
    scene.background = new THREE.Color(0xffffff)
    scene.fog = new THREE.Fog(0xffffff, 60, 160)

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200)

    const TEX_VARIANTS = 114  // ./img/1..114.webp — site grid + case-study images
    const textureLoader = new THREE.TextureLoader()
    const aspectListeners = Array.from({ length: TEX_VARIANTS }, () => [])
    const textures = loadTextureVariants(TEX_VARIANTS, textureLoader)

    const TOTAL = 1100        // images laid along the outline of "Scarlat"
    const FOCUS_DIST = 6      // planes this close to the screen centre grow
    const MAX_SCALE = 16      // how big the centre image gets
    const FOCUS_LIFT = 0.4   // focused planes come forward so nothing covers them
    const JITTER = 0.18       // keep the letters crisp: only a little scatter
    const DEPTH_RANGE = [-0.35, 0.35]
    const SIZE_RANGE = [0.42, 0.72]

    function randomBetween(min, max) { return min + Math.random() * (max - min) }

    function loadTextureVariants(count, loader) {
      return Array.from({ length: count }, (_, i) => {
        const tex = loader.load(`./img/${i + 1}.webp`, (t) => {
          const a = t.image.width / t.image.height
          tex.userData.aspect = a
          aspectListeners[i].forEach(fn => fn(a))
        })
        tex.colorSpace = THREE.SRGBColorSpace
        return tex
      })
    }

    // pull the camera back so the whole word fits on wide screens; on narrow
    // (portrait) screens cap it and glide across instead
    const VIEW_K = () => 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))
    function camDistance() {
      const k = VIEW_K()
      return Math.max(20 / k, Math.min(64 / (k * camera.aspect), 62 / k))
    }

    async function init() {
      // ./paths/scarlat.json: evenly spaced points on the outline of "Scarlat"
      // set in Mrs Saint Delafield (56 units wide, centred on the origin)
      const word = await fetch('./paths/scarlat.json').then(r => r.json())
      const xs = word.map(p => p[0])
      const halfW = (Math.max(...xs) - Math.min(...xs)) / 2

      // the camera glides left→right across the word and loops back along a flat ellipse
      const camPoint = (t) => {
        // only travel as far as needed to bring the word's ends into view
        const visHalf = camDistance() * VIEW_K() * camera.aspect / 2
        const rx = Math.max(4, halfW + 3 - visHalf)
        const a = Math.PI - t * Math.PI * 2
        return { x: rx * Math.cos(a), y: -1.8 + 1.6 * Math.sin(a) } // through the letters' body
      }

      const planes = []
      const order = Array.from({ length: TOTAL }, (_, i) => i % TEX_VARIANTS)
      for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]] }

      for (let i = 0; i < TOTAL; i++) {
        const [px, py] = word[Math.floor(i * word.length / TOTAL)]
        const size = randomBetween(...SIZE_RANGE)
        const texIndex = order[i]
        const mesh = new THREE.Mesh(
          new THREE.PlaneGeometry(size, size),
          new THREE.MeshBasicMaterial({ map: textures[texIndex], side: THREE.DoubleSide })
        )
        // keep each image's real proportions (same area as the square), never cropped
        const fitAspect = (a) => {
          mesh.geometry.dispose()
          mesh.geometry = new THREE.PlaneGeometry(size * Math.sqrt(a), size / Math.sqrt(a))
        }
        const known = textures[texIndex].userData.aspect
        known ? fitAspect(known) : aspectListeners[texIndex].push(fitAspect)

        const baseZ = randomBetween(...DEPTH_RANGE)
        mesh.position.set(px + randomBetween(-JITTER, JITTER), py + randomBetween(-JITTER, JITTER), baseZ)

        const proxy = { value: 1 }
        mesh.userData.setScale = gsap.quickTo(proxy, 'value', {
          duration: 0.45,
          ease: 'power3.out',
          onUpdate: () => {
            mesh.scale.setScalar(proxy.value)
            mesh.position.z = baseZ + (proxy.value - 1) * FOCUS_LIFT
          },
        })
        planes.push(mesh)
        scene.add(mesh)
      }

      function computeFocusScale(distance) {
        const f = 1 - distance / FOCUS_DIST
        return 1 + f ** 2.4 * (MAX_SCALE - 1)
      }

      const camProxy = { t: 0 }
      const setCamT = gsap.quickTo(camProxy, 't', { duration: 1, ease: 'power3.out' })
      let targetT = 0
      const SENSITIVITY = 0.5 / (window.innerHeight * 4)

      Observer.create({
        target: window,
        type: 'wheel,touch,pointer',
        onChange: (self) => {
          if (autoScroll) return
          targetT += (self.deltaY + self.deltaX) * SENSITIVITY
          setCamT(targetT)
        },
      })

      const AUTO_T_PER_SEC = 1 / 40
      let autoScroll = false
      const scrollToggleBtn = document.getElementById('scroll-toggle')
      scrollToggleBtn.addEventListener('click', () => {
        autoScroll = !autoScroll
        scrollToggleBtn.classList.toggle('active', autoScroll)
        scrollToggleBtn.textContent = autoScroll ? 'Auto' : 'Scroll'
      })

      let lastTime = performance.now()
      function animate() {
        requestAnimationFrame(animate)
        const now = performance.now()
        const delta = (now - lastTime) / 1000
        lastTime = now
        if (autoScroll) { targetT += AUTO_T_PER_SEC * delta; setCamT(targetT) }

        const t = ((camProxy.t % 1) + 1) % 1
        const c = camPoint(t)
        camera.position.set(c.x, c.y, camDistance())
        camera.lookAt(c.x, c.y, 0)

        for (const plane of planes) {
          const d = Math.hypot(camera.position.x - plane.position.x, camera.position.y - plane.position.y)
          plane.userData.setScale(d < FOCUS_DIST ? computeFocusScale(d) : 1)
        }
        renderer.render(scene, camera)
      }
      animate()
    }

    init()

    window.addEventListener('resize', () => {
      const w = window.innerWidth, h = window.innerHeight
      camera.aspect = w / h
      camera.updateProjectionMatrix()
      renderer.setSize(w, h)
    })
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chris Scarlat — Gallery</title>
  <meta name="description" content="Chris Scarlat's work since 1998, laid out as the words themselves — scroll to travel through them.">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; }
    body { font-family: 'Inter', Helvetica, Arial, sans-serif; }

    #canvas-container { position: fixed; inset: 0; width: 100vw; height: 100vh; }
    canvas { display: block; width: 100% !important; height: 100% !important; }

    /* --- Top bar: site name + back link --- */
    .cg-top {
      position: fixed; top: 0; left: 0; right: 0; z-index: 3;
      display: flex; align-items: center; justify-content: space-between;
      padding: 22px 28px; text-transform: uppercase; font-size: 14px; font-weight: 600;
      letter-spacing: .01em; mix-blend-mode: difference; color: #fff;
    }
    .cg-top a { color: inherit; text-decoration: none; }
    .cg-top a:hover { opacity: .7; }
    .cg-top nav { display: flex; gap: 22px; }
    .cg-top nav a { opacity: .55; transition: opacity .2s; }
    .cg-top nav a:hover, .cg-top nav a[aria-current] { opacity: 1; }
    @media (max-width: 640px) { .cg-top { padding: 16px; font-size: 13px; } .cg-top nav { gap: 16px; } }

    /* --- Auto/scroll toggle (bottom centre) --- */
    .scroll-toggle {
      position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 3;
      padding: .65rem 1.5rem; border: 1px solid rgba(0,0,0,.15); border-radius: 999px;
      background: rgba(255,255,255,.62); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      color: #2a2a28; font-family: inherit; font-size: .82rem; letter-spacing: .04em;
      text-transform: uppercase; cursor: pointer; transition: all .2s ease;
    }
    .scroll-toggle:hover { background: rgba(255,255,255,.9); }
    .scroll-toggle.active { background: #16161a; color: #f0ede8; border-color: #16161a; }

    .cg-hint {
      position: fixed; bottom: 24px; right: 28px; z-index: 3;
      font-size: 12px; color: #8a8a85; letter-spacing: .02em; user-select: none;
    }
    @media (max-width: 640px) { .cg-hint { display: none; } }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://esm.sh/three@0.184.0",
      "gsap": "https://esm.sh/gsap@3.15.0",
      "gsap/Observer": "https://esm.sh/gsap@3.15.0/Observer"
    }
  }
  </script>

	<link rel="canonical" href="https://scar.lat/gallery/">
	<link rel="sitemap" type="application/xml" href="https://scar.lat/sitemap.xml">

</head>
<body>
  <div id="canvas-container"></div>

  <script src="/assets/site-menu.js?v=20261125c" defer></script>

  <button id="scroll-toggle" class="scroll-toggle" type="button">Scroll</button>

  <div class="cg-hint">Scroll / drag to travel through the years</div>

  <script type="module">
    import * as THREE from 'three'
    import { gsap } from 'gsap'
    import { Observer } from 'gsap/Observer'

    gsap.registerPlugin(Observer)

    const renderer = new THREE.WebGLRenderer({ antialias: true })
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
    renderer.setSize(window.innerWidth, window.innerHeight)
    document.getElementById('canvas-container').appendChild(renderer.domElement)

    const scene = new THREE.Scene()
    scene.background = new THREE.Color(0xffffff)

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 400)

    const TEX_VARIANTS = 113  // ./img/1..113.webp — site grid + case-study images
    const textureLoader = new THREE.TextureLoader()
    const aspectListeners = Array.from({ length: TEX_VARIANTS }, () => [])
    const textures = loadTextureVariants(TEX_VARIANTS, textureLoader)

    const CLOSE_Z = 9         // camera distance once zoomed into the letters
    const FOCUS_DIST = 3.2    // planes this close to the screen centre grow
    const MAX_SCALE = 9       // how big the centre image gets
    const FOCUS_LIFT = 0.35   // focused planes come forward so nothing covers them
    const JITTER = 0.05       // small, so the letter outlines stay smooth
    const DEPTH_RANGE = [-0.12, 0.12]
    const SIZE_RANGE = [0.56, 0.74]
    const MAX_ASPECT = 2      // wider / taller images are centre-cropped to 2:1, never thin bars

    function randomBetween(min, max) { return min + Math.random() * (max - min) }

    function loadTextureVariants(count, loader) {
      return Array.from({ length: count }, (_, i) => {
        const tex = loader.load(`./img/${i + 1}.webp`, (t) => {
          const a = t.image.width / t.image.height
          tex.userData.aspect = a
          aspectListeners[i].forEach(fn => fn(a))
        })
        tex.colorSpace = THREE.SRGBColorSpace
        return tex
      })
    }

    // Language picked on scar.lat (saved by the site, or Google Translate's cookie)
    function siteLang() {
      try { const l = localStorage.getItem('scarlat-lang'); if (l) return l } catch (e) {}
      const m = document.cookie.match(/googtrans=\/[a-z-]+\/([a-z-]+)/i)
      const g = m ? m[1].toLowerCase() : 'en'
      return ({ ko: 'kr', ja: 'jp', de: 'de', es: 'es' })[g] || 'en'
    }

    const VIEW_K = () => 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))

    async function init() {
      // ./paths/years-<lang>.json: evenly spaced points on the outline of
      // "27 years" (Inter / Noto Sans), traced letter by letter, left → right
      let lang = siteLang()
      let data = await fetch(`./paths/years-${lang}.json`).then(r => r.ok ? r.json() : null).catch(() => null)
      if (!data) data = await fetch('./paths/years-en.json').then(r => r.json())
      const word = data.points
      document.documentElement.lang = ({ kr: 'ko', jp: 'ja' })[lang] || lang

      // the camera's route: the outline itself, parameterised by distance travelled
      const cum = [0]
      for (let i = 1; i < word.length; i++) cum.push(cum[i - 1] + Math.hypot(word[i][0] - word[i - 1][0], word[i][1] - word[i - 1][1]))
      const total = cum[cum.length - 1] + Math.hypot(word[0][0] - word.at(-1)[0], word[0][1] - word.at(-1)[1])
      function routePoint(t) {
        const d = (((t % 1) + 1) % 1) * total
        let lo = 0, hi = cum.length - 1
        while (lo < hi) { const mid = (lo + hi + 1) >> 1; cum[mid] <= d ? (lo = mid) : (hi = mid - 1) }
        const a = word[lo], b = word[(lo + 1) % word.length]
        const seg = (lo + 1 < cum.length ? cum[lo + 1] : total) - cum[lo]
        const f = seg > 0 ? (d - cum[lo]) / seg : 0
        return { x: a[0] + (b[0] - a[0]) * f, y: a[1] + (b[1] - a[1]) * f }
      }
      // overview distance: the whole phrase fits on screen
      const overviewZ = () => Math.max((data.width * 1.25) / (VIEW_K() * camera.aspect), (data.height * 1.7) / VIEW_K())
      // close-up distance: a bit further back on narrow (portrait) screens
      const closeZ = () => Math.max(CLOSE_Z, 7 / (VIEW_K() * camera.aspect))

      const planes = []
      const order = Array.from({ length: word.length }, (_, i) => i % TEX_VARIANTS)
      for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]] }

      word.forEach(([px, py], i) => {
        const size = randomBetween(...SIZE_RANGE)
        const texIndex = order[i]
        const mesh = new THREE.Mesh(
          new THREE.PlaneGeometry(size, size),
          new THREE.MeshBasicMaterial({ map: textures[texIndex], side: THREE.DoubleSide })
        )
        // keep each image's real proportions (same area as the square), never cropped
        // (very wide/tall images are shrunk, not cropped, so no plane becomes a bar)
        const fitAspect = (a0) => {
          const a = Math.min(MAX_ASPECT, Math.max(1 / MAX_ASPECT, a0))
          const w = size * Math.sqrt(a), h = size / Math.sqrt(a)
          const g = new THREE.PlaneGeometry(w, h)
          if (a !== a0) { // crop the middle of the image via UVs (texture is shared)
            const uv = g.attributes.uv, kx = a0 > a ? a / a0 : 1, ky = a0 < a ? a0 / a : 1
            for (let k = 0; k < uv.count; k++) uv.setXY(k, 0.5 + (uv.getX(k) - 0.5) * kx, 0.5 + (uv.getY(k) - 0.5) * ky)
            uv.needsUpdate = true
          }
          mesh.geometry.dispose()
          mesh.geometry = g
        }
        const known = textures[texIndex].userData.aspect
        known ? fitAspect(known) : aspectListeners[texIndex].push(fitAspect)

        const baseZ = randomBetween(...DEPTH_RANGE)
        mesh.position.set(px + randomBetween(-JITTER, JITTER), py + randomBetween(-JITTER, JITTER), baseZ)
        const proxy = { value: 1 }
        const to = gsap.quickTo(proxy, 'value', {
          duration: 0.45, ease: 'power3.out',
          onUpdate: () => { mesh.scale.setScalar(proxy.value); mesh.position.z = baseZ + (proxy.value - 1) * FOCUS_LIFT },
        })
        let last = 1
        mesh.userData.setScale = (v) => { if (Math.abs(v - last) > 0.01) { last = v; to(v) } }
        planes.push(mesh)
        scene.add(mesh)
      })

      // centre image tops out at ~85% of the visible area (matters on phones)
      function computeFocusScale(distance) {
        const z = closeZ(), viewH = z * VIEW_K(), viewW = viewH * camera.aspect
        const maxS = Math.min(MAX_SCALE, 0.85 * Math.min(viewW, viewH))
        const f = 1 - distance / FOCUS_DIST
        return 1 + f ** 2.2 * (maxS - 1)
      }

      // start with the whole phrase visible, then dive in to travel along it
      const zoomIn = { v: 0 }
      let dived = false
      const dive = () => { if (dived) return; dived = true; gsap.to(zoomIn, { v: 1, duration: 2.2, ease: 'power3.inOut' }) }
      setTimeout(dive, 1400)

      const camProxy = { t: 0 }
      const setCamT = gsap.quickTo(camProxy, 't', { duration: 1, ease: 'power3.out' })
      let targetT = 0
      const SENSITIVITY = 0.35 / (window.innerHeight * 4)

      Observer.create({
        target: window,
        type: 'wheel,touch,pointer',
        onChange: (self) => {
          dive()
          if (autoScroll) return
          targetT += (self.deltaY + self.deltaX) * SENSITIVITY
          setCamT(targetT)
        },
      })

      const AUTO_T_PER_SEC = 1 / 90
      let autoScroll = false
      const scrollToggleBtn = document.getElementById('scroll-toggle')
      scrollToggleBtn.addEventListener('click', () => {
        dive()
        autoScroll = !autoScroll
        scrollToggleBtn.classList.toggle('active', autoScroll)
        scrollToggleBtn.textContent = autoScroll ? 'Auto' : 'Scroll'
      })

      let lastTime = performance.now()
      function animate() {
        requestAnimationFrame(animate)
        const now = performance.now()
        const delta = (now - lastTime) / 1000
        lastTime = now
        if (autoScroll) { targetT += AUTO_T_PER_SEC * delta; setCamT(targetT) }

        const v = zoomIn.v, r = routePoint(camProxy.t)
        const cx = r.x * v, cy = r.y * v
        camera.position.set(cx, cy, overviewZ() + (closeZ() - overviewZ()) * v)
        camera.lookAt(cx, cy, 0)

        for (const plane of planes) {
          const d = Math.hypot(cx - plane.position.x, cy - plane.position.y)
          const s = d < FOCUS_DIST ? computeFocusScale(d) : 1
          plane.userData.setScale(1 + (s - 1) * v)
        }
        renderer.render(scene, camera)
      }
      animate()
    }

    init()

    window.addEventListener('resize', () => {
      const w = window.innerWidth, h = window.innerHeight
      camera.aspect = w / h
      camera.updateProjectionMatrix()
      renderer.setSize(w, h)
    })
  </script>
</body>
</html>

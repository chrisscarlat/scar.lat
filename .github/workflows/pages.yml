# Builds scar.lat with GitHub Pages' own Jekyll builder and deploys it.
# Replaces the classic "deploy from branch" build, which can't fetch private submodules:
# vendor/duofy (github.com/chrisscarlat/duofy, private) is fetched here with a read-only
# deploy key stored as the repository secret DUOFY_DEPLOY_KEY.
# Every branch is built (a check); only main is deployed.
name: Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Duofy (private submodule, read-only deploy key)
        env:
          DUOFY_DEPLOY_KEY: ${{ secrets.DUOFY_DEPLOY_KEY }}
        run: |
          if [ -z "$DUOFY_DEPLOY_KEY" ]; then echo "::error::Secret DUOFY_DEPLOY_KEY is missing"; exit 1; fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DUOFY_DEPLOY_KEY" > ~/.ssh/duofy && chmod 600 ~/.ssh/duofy
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/duofy -o IdentitiesOnly=yes"
          git -c url."git@github.com:chrisscarlat/duofy".insteadOf="https://github.com/chrisscarlat/duofy" \
            submodule update --init --depth 1 vendor/duofy
          rm -f ~/.ssh/duofy
          git -C vendor/duofy log --oneline -1
          test -s vendor/duofy/duofy.js && test -s vendor/duofy/duofy.css

      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'

      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Check the build
        run: |
          test -s _site/vendor/duofy/duofy.js
          test -s _site/book/book.json
          test -s _site/index.html
          test ! -e _site/vendor/duofy/index.html
          test ! -e _site/vendor/duofy/assets

      - uses: actions/upload-pages-artifact@v3

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
